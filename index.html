<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --red: #E5233D;
    --red-glow: #ff2d4a;
    --dark: #0a0a0f;
    --surface: #111118;
    --text: #f0eff4;
    --muted: #7a7a8e;
    --gold: #FFB800;
  }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--dark);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(229,35,61,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 100%, rgba(255,184,0,0.06) 0%, transparent 50%),
      radial-gradient(ellipse 40% 40% at 10% 80%, rgba(229,35,61,0.05) 0%, transparent 50%);
    z-index: 0;
    animation: bgPulse 8s ease-in-out infinite alternate;
  }

  @keyframes bgPulse {
    0% { opacity: 0.7; }
    100% { opacity: 1; }
  }

  /* Diagonal stripe texture */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      -45deg,
      transparent,
      transparent 40px,
      rgba(255,255,255,0.008) 40px,
      rgba(255,255,255,0.008) 41px
    );
    z-index: 0;
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem 1.5rem;
    max-width: 600px;
    width: 100%;
  }

  /* Top accent line */
  .accent-line {
    width: 60px;
    height: 3px;
    background: var(--red);
    margin: 0 auto 1.5rem;
    box-shadow: 0 0 20px var(--red-glow);
    animation: lineGrow 1s ease-out forwards;
  }

  @keyframes lineGrow {
    from { width: 0; opacity: 0; }
    to { width: 60px; opacity: 1; }
  }

  .event-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 0.5rem;
    animation: fadeUp 0.8s ease-out 0.2s both;
  }

  .event-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.8rem, 10vw, 5rem);
    line-height: 0.95;
    letter-spacing: 0.03em;
    margin-bottom: 0.3rem;
    animation: fadeUp 0.8s ease-out 0.35s both;
  }

  .event-title span {
    color: var(--red);
  }

  .event-subtitle {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 300;
    font-size: 1.15rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 2.5rem;
    animation: fadeUp 0.8s ease-out 0.5s both;
  }

  /* Countdown grid */
  .countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.75rem;
    margin-bottom: 2.5rem;
    animation: fadeUp 0.8s ease-out 0.65s both;
  }

  .countdown-block {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 1.2rem 0.5rem;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, border-color 0.3s;
  }

  .countdown-block::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
    opacity: 0.6;
  }

  .countdown-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.5rem, 8vw, 3.8rem);
    line-height: 1;
    color: var(--text);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .countdown-number.tick {
    transform: scale(1.08);
    color: var(--red);
  }

  .countdown-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 400;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 0.4rem;
  }

  /* Disciplines */
  .disciplines {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    margin-bottom: 2rem;
    animation: fadeUp 0.8s ease-out 0.8s both;
    flex-wrap: wrap;
  }

  .discipline {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 400;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .discipline-icon {
    font-size: 1.1rem;
  }

  .discipline strong {
    color: var(--text);
    font-weight: 600;
  }

  /* Date badge */
  .date-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    background: rgba(229,35,61,0.08);
    border: 1px solid rgba(229,35,61,0.2);
    border-radius: 100px;
    padding: 0.6rem 1.5rem;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 2rem;
    animation: fadeUp 0.8s ease-out 0.95s both;
  }

  .date-badge .dot {
    width: 6px;
    height: 6px;
    background: var(--red);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(229,35,61,0.4); }
    50% { opacity: 0.7; box-shadow: 0 0 0 8px rgba(229,35,61,0); }
  }

  /* Location */
  .location {
    font-family: 'Barlow', sans-serif;
    font-weight: 300;
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    animation: fadeUp 0.8s ease-out 1.1s both;
    margin-bottom: 1.8rem;
  }

  .location strong {
    color: var(--text);
    font-weight: 400;
  }

  /* Official link */
  .official-link {
    animation: fadeUp 0.8s ease-out 1.25s both;
  }

  .official-link a {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--red);
    text-decoration: none;
    padding: 0.6rem 1.2rem;
    border: 1px solid rgba(229,35,61,0.3);
    border-radius: 8px;
    transition: all 0.3s ease;
  }

  .official-link a:hover {
    background: rgba(229,35,61,0.1);
    border-color: var(--red);
  }

  .official-link a svg {
    width: 14px;
    height: 14px;
    fill: none;
    stroke: var(--red);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Race day message */
  .race-day {
    display: none;
    animation: fadeUp 0.8s ease-out forwards;
  }

  .race-day h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 12vw, 6rem);
    color: var(--gold);
    text-shadow: 0 0 40px rgba(255,184,0,0.3);
    line-height: 1;
    margin-bottom: 0.5rem;
  }

  .race-day p {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.3rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Mobile fine-tuning */
  @media (max-width: 400px) {
    .countdown { gap: 0.4rem; }
    .countdown-block { padding: 1rem 0.3rem; border-radius: 8px; }
    .disciplines { gap: 1rem; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="accent-line"></div>
  <div class="event-label">Race Day Countdown</div>
  <div class="event-title">IRONMAN <span>70.3</span></div>
  <div class="event-subtitle">Weymouth · Dorset · UK</div>

  <div class="countdown" id="countdown">
    <div class="countdown-block">
      <div class="countdown-number" id="days">---</div>
      <div class="countdown-label">Days</div>
    </div>
    <div class="countdown-block">
      <div class="countdown-number" id="hours">--</div>
      <div class="countdown-label">Hours</div>
    </div>
    <div class="countdown-block">
      <div class="countdown-number" id="mins">--</div>
      <div class="countdown-label">Mins</div>
    </div>
    <div class="countdown-block">
      <div class="countdown-number" id="secs">--</div>
      <div class="countdown-label">Secs</div>
    </div>
  </div>

  <div class="disciplines">
    <div class="discipline">
      <span class="discipline-icon">🏊‍♂️</span>
      <span><strong>1.2</strong> mi swim</span>
    </div>
    <div class="discipline">
      <span class="discipline-icon">🚴‍♂️</span>
      <span><strong>56</strong> mi bike</span>
    </div>
    <div class="discipline">
      <span class="discipline-icon">🏃‍♂️</span>
      <span><strong>13.1</strong> mi run</span>
    </div>
  </div>

  <div class="date-badge">
    <span class="dot"></span>
    20 September 2026 · 09:00 BST
  </div>

  <div class="location">
    <strong>Jurassic Coast</strong> · Weymouth, Dorset, England
  </div>

  <div class="official-link">
    <a href="https://www.ironman.com/im703-weymouth" target="_blank" rel="noopener">
      Official Race Info — ironman.com
      <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </a>
  </div>

  <div class="race-day" id="raceDay">
    <h2>RACE DAY!</h2>
    <p>Go smash it 🔥</p>
  </div>
</div>

<script>
  const raceDate = new Date('2026-09-20T08:00:00Z'); // 09:00 BST = 08:00 UTC

  const $days = document.getElementById('days');
  const $hours = document.getElementById('hours');
  const $mins = document.getElementById('mins');
  const $secs = document.getElementById('secs');
  const $countdown = document.getElementById('countdown');
  const $raceDay = document.getElementById('raceDay');

  let prev = {};

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick(el) {
    el.classList.add('tick');
    setTimeout(() => el.classList.remove('tick'), 300);
  }

  function update() {
    const now = new Date();
    const diff = raceDate - now;

    if (diff <= 0) {
      $countdown.style.display = 'none';
      document.querySelector('.disciplines').style.display = 'none';
      document.querySelector('.date-badge').style.display = 'none';
      $raceDay.style.display = 'block';
      return;
    }

    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);

    if (prev.d !== d) { $days.textContent = d; tick($days); }
    if (prev.h !== h) { $hours.textContent = pad(h); tick($hours); }
    if (prev.m !== m) { $mins.textContent = pad(m); tick($mins); }
    if (prev.s !== s) { $secs.textContent = pad(s); tick($secs); }

    prev = { d, h, m, s };
  }

  update();
  setInterval(update, 1000);
</script>
</body>
